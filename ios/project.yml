name: ClearSugar
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

# Server URL, bundle prefix, and signing team come from Config/Server.xcconfig.
# Copy Config/Server.xcconfig.example to Config/Server.xcconfig (or run
# `npm run setup` on the server) BEFORE running `xcodegen generate`.
configFiles:
  Debug: Config/Server.xcconfig
  Release: Config/Server.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  ClearSugar:
    type: application
    platform: iOS
    sources:
      - path: ClearSugar
        excludes:
          - "Widgets/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEARSUGAR_BUNDLE_PREFIX)
        INFOPLIST_FILE: ClearSugar/Info.plist
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        CODE_SIGN_ENTITLEMENTS: ClearSugar/ClearSugar.entitlements
    dependencies:
      - target: ClearSugarWatch
      - target: ClearSugarWidgets

  ClearSugarWatch:
    type: application
    platform: watchOS
    sources:
      - path: ClearSugarWatch
        excludes:
          - "Complications/**"
      - ClearSugar/Models/GlucoseReading.swift
      - ClearSugar/Shared/AppConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEARSUGAR_BUNDLE_PREFIX).watchkitapp
        INFOPLIST_FILE: ClearSugarWatch/Info.plist
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_ENTITLEMENTS: ClearSugarWatch/ClearSugarWatch.entitlements
    dependencies:
      - target: ClearSugarWatchWidgets

  ClearSugarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ClearSugar/Widgets
      - ClearSugar/Models/GlucoseReading.swift
      - ClearSugar/Shared/AppConfig.swift
      - ClearSugar/Shared/GlucoseActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEARSUGAR_BUNDLE_PREFIX).widgets
        INFOPLIST_FILE: ClearSugar/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClearSugar/Widgets/Widgets.entitlements

  ClearSugarWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - ClearSugarWatch/Complications
      - ClearSugar/Models/GlucoseReading.swift
      - ClearSugar/Shared/AppConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEARSUGAR_BUNDLE_PREFIX).watchkitapp.complications
        INFOPLIST_FILE: ClearSugarWatch/Complications/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClearSugarWatch/Complications/Complications.entitlements
